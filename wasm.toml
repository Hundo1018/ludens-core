# ludens-wasm-rt manifest (17.89 W0): the C-ABI as a wasm64 module.
#   pixi run wasm        -> build/ludens64.wasm
# Serial dispatch and no asserts keep the IR to the allocator, write and the clock (W1).
[lib]
name = "ludens"
mojo_defines = ["LUDENS_SERIAL=True", "ASSERT=none"]

[native]
mojo_defines = ["LUDENS_SERIAL=False"]
