# ROADMAP 17.81: the local gate (`pixi run gate`) on every PR and push to main,
# plus a nightly run of everything `pixi run test` leaves out.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"  # 02:17 Asia/Taipei
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: changelog and archindex read git
      - uses: ./.github/actions/pixi-install
      - name: gate tool selftest (golden, archindex)
        run: pixi run gate -- --selftest
      - name: doc references (README, CLAUDE, ROADMAP, ARCHITECTURE)
        run: pixi run doclint
      - name: unwired modules (scripts/orphans_allow.txt)
        run: pixi run orphans
      - name: hook rules and doc generator selftests (17.87)
        run: pixi run hooks-selftest
      - name: package-layer tables match arch_layers.toml (17.87)
        run: pixi run layers-sync
      - name: ROADMAP subsystem table matches the index (17.87)
        run: pixi run roadmap-status -- --check
      # docs/STRUCTURE.md flows one way: the structure job below writes it on
      # main and branches only pull it. A PR that changes it would bring the
      # merge conflicts back, so the PR's merge result must match main.
      - name: docs/STRUCTURE.md is main's version (CI owns it)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet "origin/${{ github.base_ref }}" HEAD -- docs/STRUCTURE.md; then
            echo "docs/STRUCTURE.md differs from ${{ github.base_ref }}. Take main's version:" >&2
            echo "    git checkout origin/${{ github.base_ref }} -- docs/STRUCTURE.md" >&2
            exit 1
          fi
      - name: floating-point flag policy (docs/ARCHITECTURE.md §6)
        run: pixi run flag-policy
      - name: benchmark template / files / report consistency
        run: pixi run perf -- governance
      - name: benchmark report not older than any bench (17.83)
        run: pixi run bench-fresh
      - name: gate (build, arch-check, unit..system, golden compare)
        # 4 files at a time (scripts/run_tests.sh): the sequential suite
        # passed the 3600 s gate budget on this runner at ~270 files; with 4
        # at a time the suite passed it again at ~370 files (PR #39, exit 124).
        env:
          LUDENS_TEST_JOBS: 4
          GATE_TIMEOUT: 6600
        run: pixi run gate
      - name: wasm leaf-kernel probe (tools/wasm)
        run: pixi run wasm-probe
      - name: upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: build/agent_gate.log

  # ROADMAP 17.89 W2 (#74): the C-ABI as wasm64 hashes like the native reference build
  # (node 24 + wasmtime from ludens-wasm-rt's pixi environment).
  wasm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUDENS_WASM_RT: ${{ github.workspace }}/ludens-wasm-rt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hundo1018/ludens-wasm-rt
          path: ludens-wasm-rt
      - uses: ./.github/actions/pixi-install
      - name: wasm gate (scenes native vs wasmtime, worlds native vs node)
        run: pixi run wasm-gate

  # ROADMAP 17.76: the same gate on linux-aarch64 and osx-arm64. A probe
  # until each platform has its own golden (tests/golden/test_stdout.<os>-<arch>.txt):
  # failures are reported, not blocking.
  portability:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pixi-install
      # First run on a platform: no golden to compare against yet, so record
      # one (the suite must still pass) and print it between markers; it is
      # read back from the job log and committed as
      # tests/golden/test_stdout.<os>-<arch>.txt. Later runs compare.
      - name: gate (records and prints the platform golden on first run)
        env:
          LUDENS_TEST_JOBS: 3
          GATE_TIMEOUT: 8400
        run: |
          plat="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          golden="tests/golden/test_stdout.$plat.txt"
          # on failure, show which test failed (the uploaded log is not
          # readable from the job page)
          show() { tail -120 build/agent_gate.log; exit 1; }
          if [ -f "$golden" ]; then
            pixi run gate || show
          else
            pixi run gate -- --update-golden || show
            echo "----- BEGIN GOLDEN $golden -----"
            cat "$golden"
            echo "----- END GOLDEN $golden -----"
          fi
      # ROADMAP 17.76: this platform's three probe scenes after 300 steps,
      # printed for the cross-target comparison against x86-64
      # (`pixi run fp-probe -- --compare <dump>` on the reference host).
      - name: fp probe dump
        run: |
          pixi run fp-probe -- --dump build/fp_dump.json
          echo "----- BEGIN FP DUMP -----"
          cat build/fp_dump.json
          echo
          echo "----- END FP DUMP -----"
      - name: upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ matrix.os }}
          path: build/agent_gate.log

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: changelog and archindex read git
      - uses: ./.github/actions/pixi-install
      - run: pixi run test-stress
      - run: pixi run examples
      - run: pixi run experiments
      - run: pixi run spikes
      # Smoke only: the numbers are compared by 17.83, not here.
      - run: pixi run benchmark
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            build/*.log
            BENCHMARK_REPORT.md

  # docs/STRUCTURE.md is owned by CI: each push to main regenerates it and
  # commits the result back to main. PR branches never edit the file, so
  # merges cannot conflict on it; pull main to see the current listing.
  structure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pixi-install
      - name: regenerate docs/STRUCTURE.md and commit it to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -q -B main origin/main
            pixi run structure
            if git diff --quiet -- docs/STRUCTURE.md; then
              echo "docs/STRUCTURE.md is already current"
              exit 0
            fi
            git add docs/STRUCTURE.md
            git commit -q -m "docs: regenerate docs/STRUCTURE.md"
            if git push origin HEAD:main; then
              echo "pushed regenerated docs/STRUCTURE.md"
              exit 0
            fi
            echo "push raced with another commit on main (attempt $attempt); retrying"
          done
          echo "could not push after 3 attempts" >&2
          exit 1
